services:
  postgres:
    image: postgis/postgis:17-3.5
    container_name: lockly-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME_POSTGRE}
      POSTGRES_PASSWORD: ${DB_PASSWORD_POSTGRE}
      POSTGRES_DB: lockly_db
    # Thay ports bằng expose để chỉ cho backend truy cập nội bộ qua port 5432
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lockly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_vietnam_gis:
    image: postgis/postgis:17-3.5
    container_name: lockly-postgres-vietnam-gis
    restart: always
    environment:
      POSTGRES_USER: ${LOCATION_DB_USERNAME_POSTGRE}
      POSTGRES_PASSWORD: ${LOCATION_DB_PASSWORD_POSTGRE}
      POSTGRES_DB: vietnam_gis
    # Expose port gốc 5432 nội bộ (BE vẫn gọi vào port này qua bridge network)
    expose:
      - "5432"
    volumes:
      - postgres_vietnam_gis:/var/lib/postgresql/data
      - ./postgres-init/vietnam_gis:/docker-entrypoint-initdb.d
    networks:
      - lockly-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: lockly-redis
    restart: always
    # Thay ports bằng expose cho port 6379 nội bộ
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - lockly-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13.7-management
    container_name: lockly-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # Port 5672 để expose nội bộ cho BE. Port 15672 giữ lại ports để bạn vào Web UI từ máy host.
    expose:
      - "5672"
    ports:
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - lockly-network
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: lockly-qdrant
    restart: always
    # Chuyển thành expose để bảo mật nội bộ
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - lockly-network

  minio:
    image: quay.io/minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: lockly-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    # Port 9000 (API) chuyển thành expose. Port 9001 (Console UI) giữ lại ports để bạn quản lý giao diện.
    expose:
      - "9000"
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lockly-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: lockly-minio-init
    restart: on-failure
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lockly-network
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set myminio http://lockly-minio:9000 ${MINIO_ACCESS_KEY} ${MINIO_SECRET_KEY}; do
        sleep 2;
      done;
      /usr/bin/mc mb myminio/${MINIO_BUCKET_NAME} || true;
      /usr/bin/mc anonymous set public myminio/${MINIO_BUCKET_NAME} || true;
      "

  nginx:
    image: nginx:latest
    container_name: lockly-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

      # LET'S ENCRYPT
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - lockly-network

  backend:
    image: khanhsayhi/lockly-backend:v2
    container_name: lockly-backend-v2
    restart: always
    expose:
      - "8080"
    environment:
      DB_URL_POSTGRE: ${DB_URL_POSTGRE}
      DB_USERNAME_POSTGRE: ${DB_USERNAME_POSTGRE}
      DB_PASSWORD_POSTGRE: ${DB_PASSWORD_POSTGRE}

      LOCATION_DB_URL_POSTGRE: ${LOCATION_DB_URL_POSTGRE}
      LOCATION_DB_USERNAME_POSTGRE: ${LOCATION_DB_USERNAME_POSTGRE}
      LOCATION_DB_PASSWORD_POSTGRE: ${LOCATION_DB_PASSWORD_POSTGRE}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
    depends_on:
      postgres:
        condition: service_healthy
      postgres_vietnam_gis:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - lockly-network

networks:
  lockly-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_vietnam_gis:
  redis_data:
  rabbitmq_data:
  minio_data:
  qdrant_data: