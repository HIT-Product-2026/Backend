backend:
  image: khanhsayhi/lockly-backend:v2
  container_name: lockly-backend-v2
  restart: always
  ports:
    - "8082:8080"
  environment:
    - DB_URL=${DB_URL_POSTGRE}
    - DB_USERNAME=${DB_USERNAME_POSTGRE}
    - DB_PASSWORD=${DB_PASSWORD_POSTGRE}

    - LOCATION_DB_URL=${LOCATION_DB_URL_POSTGRE}
    - LOCATION_DB_USERNAME=${LOCATION_DB_USERNAME_POSTGRE}
    - LOCATION_DB_PASSWORD=${LOCATION_DB_PASSWORD_POSTGRE}

    - MINIO_ENDPOINT=${MINIO_ENDPOINT}
    - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
    - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}

    - REDIS_HOST=${REDIS_HOST}
    - REDIS_PORT=${REDIS_PORT}

    - RABBITMQ_HOST=${RABBITMQ_HOST}
    - RABBITMQ_PORT=${RABBITMQ_PORT}
    - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
    - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}

    - JWT_SECRET=${JWT_SECRET}
    - JWT_ACCESS_EXPIRATION=${JWT_ACCESS_EXPIRATION}
    - JWT_REFRESH_EXPIRATION=${JWT_REFRESH_EXPIRATION}
  depends_on:
    postgres:
      condition: service_healthy
    postgres_vietnam_gis:
      condition: service_healthy
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  networks:
    - lockly-network
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:8080/v3/api-docs || exit 1"]
    interval: 20s
    timeout: 5s
    retries: 5
    start_period: 30s