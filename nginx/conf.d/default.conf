upstream backend_service {
    server backend:8080;
}

server {
    listen 80;
    server_name lockly-api.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;

    server_name lockly-api.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/lockly-api.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lockly-api.duckdns.org/privkey.pem;

    client_max_body_size 100M;

    limit_req zone=api_limit burst=20;

    #
    # SSE
    #
    location /api/v2/sse/ {
        proxy_pass http://backend_service;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Connection "";

        proxy_buffering off;
        proxy_cache off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        add_header X-Accel-Buffering no;
    }

    #
    # Các API còn lại
    #
    location / {
        proxy_pass http://backend_service;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}

server {
    listen 80;
    server_name lockly-minio.duckdns.org;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;

    server_name lockly-minio.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/lockly-minio.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lockly-minio.duckdns.org/privkey.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://lockly-minio:9000;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}