global:
  scrape_interval: 15s


scrape_configs:

  # Backend Spring Boot Actuator
  - job_name: lockly-backend

    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend:8080

  - job_name: postgres

    static_configs:
      - targets:
          - postgres-exporter:9187


  # Docker container metrics
  - job_name: cadvisor

    static_configs:
      - targets:
          - cadvisor:8080


  - job_name: rabbitmq
    
    static_configs:
      - targets:
          - lockly-rabbitmq:15692