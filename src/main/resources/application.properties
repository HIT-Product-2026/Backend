# ===== APP =====
spring.application.name=lockly

# ===== DATABASE (PostgreSQL) =====
spring.datasource.url=${DB_URL_POSTGRE}
spring.datasource.username=${DB_USERNAME_POSTGRE}
spring.datasource.password=${DB_PASSWORD_POSTGRE}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET:lockly-super-secret-key-must-be-at-least-32-characters-long}
jwt.access.expiration_time=${JWT_ACCESS_EXPIRATION:12960000000}
jwt.refresh.expiration_time=${JWT_REFRESH_EXPIRATION:604800000}

# ===== OTP =====
otp.expiration-minutes=5
otp.resend-cooldown-seconds=60
otp.max-attempts=5

# ===== GMAIL SMTP =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ntdnqb2006@gmail.com
spring.mail.password=xrmw ndlx xecf oxku
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== MINIO =====
minio.endpoint=${MINIO_ENDPOINT}
minio.public-endpoint=${MINIO_PUBLIC_ENDPOINT}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.bucket-name=${MINIO_BUCKET_NAME}

# ===== LOGGING =====
logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.security.web.access=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=TRACE
logging.level.com.example.lockly=DEBUG

# ===== REDIS =====
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# ===== RABBITMQ =====
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

logging.level.org.springframework.amqp=DEBUG

# ===== FLYWAY =====
spring.flyway.enabled=true

# ======= WEB SOCKET ===========
spring.websocket.heartbeat.server=30000
spring.websocket.heartbeat.client=30000