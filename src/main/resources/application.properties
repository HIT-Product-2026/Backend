# ===== APP =====
spring.application.name=lockly

# ===== DATABASE (MySQL) =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
jwt.secret=${JWT_SECRET:lockly-super-secret-key-must-be-at-least-32-characters-long}
jwt.access.expiration_time=${JWT_ACCESS_EXPIRATION:12960000000}
jwt.refresh.expiration_time=${JWT_REFRESH_EXPIRATION:604800000}

# ===== OTP =====
otp.expiration-minutes=5
otp.resend-cooldown-seconds=60
otp.max-attempts=5

