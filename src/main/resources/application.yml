spring:
  datasource:
    url: ${DB_URL_POSTGRE}
    username: ${DB_USERNAME_POSTGRE}
    password: ${DB_PASSWORD_POSTGRE}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    validate-on-migrate: true
    locations: classpath:db/migration
    url: ${DB_URL_POSTGRE}
    user: ${DB_USERNAME_POSTGRE}
    password: ${DB_PASSWORD_POSTGRE}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  qdrant:
    host: qdrant
    port: 6334

server:
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

  endpoint:
    prometheus:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      aiService:
        failureRateThreshold: 50
        slidingWindowSize: 10
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3

#DB Thứ 2
location:
  datasource:
    url: ${LOCATION_DB_URL_POSTGRE}
    username: ${LOCATION_DB_USERNAME_POSTGRE}
    password: ${LOCATION_DB_PASSWORD_POSTGRE}
    driver-class-name: org.postgresql.Driver